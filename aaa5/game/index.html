<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Race to 270</title>
<meta name="description" content="AAA 5 class game: run a presidential campaign, answer questions, win states and reach 270 electoral votes.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/quiz.css">
<style>
:root{--m:#2B3950;--m2:#4A5F80;--t0:#C0392B;--t1:#2563A8;--t2:#2E8B57;--t3:#B7791F}
.wrap{max-width:1180px}
.setup{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:820px){.setup{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--m2);margin-bottom:10px}
.panel p,.panel li{font-size:14.5px}.panel ol{padding-left:18px;display:grid;gap:6px}
.field{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.field label{font-size:14px;font-weight:600;min-width:90px}
.field input[type=text]{flex:1;min-width:140px;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{font:inherit;font-weight:700;padding:7px 12px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}.seg button.on{border-color:var(--m);background:var(--m);color:#fff}
.chip{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px}
.game{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.game{grid-template-columns:1fr}}
.map{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.st{aspect-ratio:1;border-radius:7px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;position:relative;min-width:0}
.st b{font-size:clamp(10px,1.25vw,15px);line-height:1}.st small{font-size:clamp(9px,.95vw,12px);opacity:.75;line-height:1.1}
.st .dots{display:flex;justify-content:center;gap:2px;margin-top:2px;min-height:12px}
.st .dots i{min-width:12px;height:12px;border-radius:6px;font-style:normal;font-size:9px;font-weight:800;color:#fff;line-height:12px;padding:0 2px}
.st:hover:not(:disabled){border-color:var(--m2)}
.st.own{color:#fff;border-color:transparent}.st.own small{opacity:.9}
.st:disabled{cursor:default}
.st.flash{animation:fl .5s}@keyframes fl{50%{transform:scale(1.15)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.side{display:grid;gap:12px}
.turn{border-radius:14px;padding:14px 16px;color:#fff}
.turn .k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.turn b{font-family:"Source Serif 4",Georgia,serif;font-size:22px;display:block}
.money{font-size:28px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card .k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--m2)}
.card h4{font-family:"Source Serif 4",Georgia,serif;font-size:18px;margin:2px 0 4px}
.card p{font-size:14.5px}
.card .why{font-size:13px;color:var(--muted);margin-top:6px}
.qq{font-family:"Source Serif 4",Georgia,serif;font-size:18px;margin:6px 0 10px;font-weight:600}
.opts{gap:8px}.opt{padding:9px 12px}
.score{display:grid;gap:8px}
.score .row2{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;font-size:14px}
.score .trk{height:14px;background:var(--line);border-radius:99px;position:relative;overflow:hidden}
.score .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.score .goal{position:relative;height:0}.score .goal::after{content:"270";position:absolute;font-size:10px;color:var(--muted)}
.mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}
.small{font-size:13px;color:var(--muted)}
.btn.sm{padding:8px 12px;font-size:14px}
.end{text-align:center}
</style>
</head><body><div class="wrap">
<header class="top"><a class="brand" href="../"><span class="badge">AAA 5</span><span><small>Kremnická 26 · Bratislava · class game</small><b>Race to 270</b></span></a></header>
<main id="app"></main>
<footer>English and American Literature and Culture · Year 5 · Class game. No sign-in, no data collected. Electoral votes: National Archives, allocation based on the 2020 Census.</footer>
</div>
<script src="../questions.js"></script><script src="game.js"></script>
</body></html>
