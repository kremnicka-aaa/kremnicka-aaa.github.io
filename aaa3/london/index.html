<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>London Calling</title>
<meta name="description" content="AAA 3 game: be a London reporter through the 20th century – from the suffragettes to the EU referendum. Choose your sources, write the headline, build your career.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--paper:#EFEADF;--paper2:#E2DBCB;--red:#B3121B;--muted:#6B655B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#121212;color:var(--ink);font-family:"Old Standard TT",Georgia,serif}
body{background:radial-gradient(ellipse at 50% 0%,#2A2A2A,#0E0E0E 70%)}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;color:#D8D2C4;font:700 13px Inter;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;gap:10px;flex-wrap:wrap}
header a{color:inherit;text-decoration:none}
.tools{display:flex;gap:8px}.tools button{font:700 12px Inter;background:rgba(255,255,255,.08);color:#D8D2C4;border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:6px 10px;cursor:pointer}
.paper{background:var(--paper);background-image:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.55),transparent 55%),repeating-linear-gradient(90deg,rgba(0,0,0,.015) 0 1px,transparent 1px 4px);border-radius:2px;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:clamp(16px,3vw,36px);position:relative}
.mast{text-align:center;border-bottom:4px double var(--ink);padding-bottom:8px;margin-bottom:10px}
.mast h1{font:900 clamp(36px,7vw,84px)/1 "Playfair Display",serif;letter-spacing:-.01em}
.mast .bar{display:flex;justify-content:space-between;font:700 12px "Old Standard TT";text-transform:uppercase;letter-spacing:.12em;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:4px 0;margin-top:8px}
.kick{font:700 12px Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
h2{font:900 clamp(26px,4.2vw,50px)/1.02 "Playfair Display",serif;margin:6px 0 10px}
.type{font:400 clamp(16px,1.9vw,20px)/1.55 "Special Elite",monospace;white-space:pre-wrap}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(14px,2.4vw,28px);align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
figure img{width:100%;display:block;filter:grayscale(1) contrast(1.15) sepia(.12);border:1px solid var(--ink)}
figcaption{font:italic 13px "Old Standard TT";color:var(--muted);margin-top:4px}
.choices{display:grid;gap:10px;margin-top:14px}
.choice{font:400 clamp(15px,1.6vw,18px)/1.35 "Special Elite",monospace;text-align:left;background:#F8F5EE;border:2px solid var(--ink);border-radius:2px;padding:12px 14px;cursor:pointer;color:var(--ink);transition:transform .1s,box-shadow .1s;box-shadow:3px 3px 0 var(--ink)}
.choice:hover,.choice:focus-visible{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);outline:none}
.choice small{display:block;font:600 12px Inter;color:var(--muted);margin-top:3px}
.choice.head{font:900 clamp(17px,2vw,22px)/1.15 "Playfair Display",serif}
.note{background:#FFF8DC;border:1px solid #CFC08A;padding:10px 12px;font:400 15px/1.45 "Special Elite",monospace;transform:rotate(-.6deg);box-shadow:2px 3px 8px rgba(0,0,0,.18);margin-top:12px}
.stats{display:flex;gap:18px;flex-wrap:wrap;font:700 13px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:16px;border-top:1px solid #BDB5A3;padding-top:10px}
.stars{color:var(--red);letter-spacing:2px}
.front{background:var(--paper);border:1px solid var(--ink);padding:14px;margin-top:10px}
.front .hl{font:900 clamp(26px,4.4vw,52px)/1.02 "Playfair Display",serif;text-align:center;margin:8px 0}
.front .sub{font:italic clamp(15px,1.6vw,18px) "Old Standard TT";text-align:center;margin-bottom:10px}
.front .body{columns:2;column-gap:18px;font:400 15px/1.5 "Old Standard TT";text-align:justify}
@media (max-width:640px){.front .body{columns:1}}
.btn{font:800 15px Inter;background:var(--red);color:#fff;border:0;border-radius:2px;padding:12px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);margin-top:14px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{font:600 15px Inter;text-align:left;background:#F8F5EE;border:2px solid var(--ink);padding:10px;cursor:pointer;color:var(--ink)}
.opt.ok{background:#DDEBD5;border-color:#2E6B3A}.opt.bad{background:#F2D6D6;border-color:var(--red)}
.fb{margin-top:8px;font:400 15px "Special Elite",monospace}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.mini{background:var(--paper);border:1px solid var(--ink);padding:8px;font:900 15px/1.1 "Playfair Display",serif}
.mini small{display:block;font:700 10px Inter;letter-spacing:.1em;color:var(--red);margin-bottom:4px}
.stamp{position:absolute;right:24px;top:24px;font:900 22px Inter;color:var(--red);border:4px solid var(--red);padding:4px 10px;transform:rotate(8deg);opacity:.85;letter-spacing:.1em}
.fade{animation:fd .5s ease}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.press{animation:pr .9s cubic-bezier(.2,.9,.3,1.2)}@keyframes pr{0%{transform:scale(.3) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.small{font:500 12px Inter;color:var(--muted)}
.timeline{display:flex;gap:4px;margin:10px 0}.timeline span{flex:1;height:6px;background:#CFC6B2}.timeline span.done{background:var(--ink)}.timeline span.here{background:var(--red)}
</style>
</head><body><div class="wrap">
<header><a href="../">AAA 3 · Kremnická 26 · game</a><div class="tools"><button id="snd">♪ sound on</button></div></header>
<main id="app"></main>
<p class="small" style="color:#8A847A;margin-top:12px;text-align:center">“The Daily Courier” is an invented newspaper. The events are real. No sign-in, no data collected.</p>
</div>
<script src="../../assets/lib/aaa-kit.js"></script><script src="../questions.js"></script><script src="london.js"></script>
</body></html>
