<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Oregon Trail</title>
<meta name="description" content="AAA 4 game: take a family from Missouri to Oregon in 1846. Manage food, oxen and health and decide at every river.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/quiz.css">
<style>
:root{--m:#2C5559;--m2:#3E7177}
.wrap{max-width:640px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{font-size:18px}
.stat.low b{color:var(--bad)}
.route{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.route .line{height:8px;border-radius:99px;background:var(--line);position:relative;margin:8px 0 4px}
.route .line i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--gold)}
.route .line s{position:absolute;top:-3px;width:4px;height:14px;border-radius:2px;background:var(--m2);text-decoration:none}
.route .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.scene{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.scene .k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--m2)}
.scene h2{font-family:"Source Serif 4",Georgia,serif;font-size:23px;margin:2px 0 8px}
.scene p{margin-bottom:8px}
.fact{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--tint);font-size:14.5px}
.fact b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--m2);margin-bottom:2px}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{font:inherit;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer}
.choice:hover:not(:disabled),.choice:focus-visible{border-color:var(--m);outline:none}
.choice b{display:block}.choice span{font-size:13px;color:var(--muted)}
.choice:disabled{opacity:.45;cursor:default}
.family{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.family span{font-size:13px;padding:4px 9px;border-radius:99px;border:1px solid var(--line)}
.family span.sick{border-color:var(--gold);color:var(--gold);font-weight:700}
.family span.gone{text-decoration:line-through;opacity:.5}
.shop{display:grid;gap:8px;margin-top:8px}
.item{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.item small{display:block;color:var(--muted);font-size:12px}
.item button{font:inherit;font-weight:800;width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.item b.q{min-width:34px;text-align:center}
.log{font-size:13.5px;color:var(--muted);margin-top:10px}
input.nm{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.opt{padding:10px 12px}
</style>
</head><body><div class="wrap">
<header class="top"><a class="brand" href="../"><span class="badge">AAA 4</span><span><small>Kremnická 26 · Bratislava · game</small><b>The Oregon Trail</b></span></a></header>
<main id="app"></main>
<footer>English and American Literature and Culture · Year 4 · No sign-in, no data collected. Historical notes: National Park Service, Oregon National Historic Trail. Prices and distances in the game are simplified.</footer>
</div>
<script src="../questions.js"></script><script src="trail.js"></script>
</body></html>
