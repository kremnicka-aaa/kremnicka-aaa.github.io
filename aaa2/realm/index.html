<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Defend the Realm</title>
<meta name="description" content="AAA 2 game: defend Britain against the Vikings, the Normans and the Spanish Armada. Answer history questions to pay for your defenders.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700;800&family=Source+Serif+4:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--ink:#2A2018;--parch:#F3E6C8;--parch2:#E6D3A8;--red:#8E1F2C;--gold:#C9962E;--green:#3E6B3A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#15110D;color:var(--parch);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16))}
#game{position:absolute;inset:0}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(18,12,8,.62);backdrop-filter:blur(2px);z-index:5;padding:2%}
#ov.on{display:flex}
.sheet{background:var(--parch);color:var(--ink);border-radius:6px;max-width:880px;width:100%;max-height:100%;overflow:auto;padding:clamp(14px,2.4vw,30px);box-shadow:0 0 0 3px var(--gold),0 0 0 7px var(--ink),0 20px 60px rgba(0,0,0,.6);background-image:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.5),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(150,110,50,.18),transparent 60%)}
.sheet .kick{font:800 clamp(10px,1.1vw,13px) Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.sheet h2{font:800 clamp(22px,3.2vw,40px)/1.05 Cinzel,serif;margin:4px 0 10px}
.sheet p{font:500 clamp(14px,1.45vw,18px)/1.45 "Source Serif 4",Georgia,serif;margin-bottom:10px}
.sheet .small{font:400 clamp(11px,1vw,13px)/1.4 Inter;color:#6B5A44}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.4vw,18px);margin-top:10px}
.lv{background:#FBF4E2;border:2px solid var(--ink);border-radius:6px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .15s}
.lv:hover,.lv:focus-visible{transform:translateY(-4px);outline:3px solid var(--gold)}
.lv .pic{height:clamp(80px,13vw,170px);background-size:cover;background-position:center;border-bottom:2px solid var(--ink)}
.lv .tx{padding:8px 10px 10px}
.lv b{display:block;font:800 clamp(13px,1.5vw,19px) Cinzel,serif}
.lv span{font-size:clamp(11px,1.05vw,13.5px);color:#5B4A35}
.lv em{display:inline-block;margin-top:5px;font-style:normal;font-weight:800;font-size:11px;letter-spacing:.08em;color:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{font:800 clamp(13px,1.3vw,16px) Inter;background:var(--red);color:#fff;border:0;border-radius:6px;padding:11px 18px;cursor:pointer;box-shadow:0 3px 0 #4E0F17}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #4E0F17}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.q{font:700 clamp(17px,2vw,24px)/1.3 "Source Serif 4",Georgia,serif;margin:6px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font:600 clamp(13px,1.35vw,16px) Inter;text-align:left;background:#FBF4E2;color:var(--ink);border:2px solid #B9A57E;border-radius:6px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.opt i{font-style:normal;font-weight:800;width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--parch)}
.opt.ok{border-color:var(--green);background:#E3EEDA}.opt.ok i{background:var(--green)}
.opt.bad{border-color:var(--red);background:#F3DADB}.opt.bad i{background:var(--red)}
.fb{margin-top:10px;padding:10px 12px;border-left:4px solid var(--gold);background:#EFE0BD;font-size:clamp(13px,1.3vw,15.5px)}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(12px,2vw,24px);align-items:start}
.split img{width:100%;border:2px solid var(--ink);border-radius:4px;display:block}
.cap{font-size:11px;color:#6B5A44;margin-top:4px}
@media (max-width:640px){.levels{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.split{grid-template-columns:1fr}}
#rot{display:none;position:fixed;inset:0;background:#15110D;color:var(--parch);z-index:9;align-items:center;justify-content:center;text-align:center;padding:24px;font:600 18px Inter}
@media (orientation:portrait) and (max-width:700px){#rot{display:flex}}
a{color:inherit}
</style>
</head><body>
<div id="wrap"><div id="stage"><div id="game"></div><div id="ov"></div></div></div>
<div id="rot"><div><div style="font:800 28px Cinzel,serif;margin-bottom:10px">Defend the Realm</div>Turn your phone sideways to play.<br><span style="opacity:.6;font-size:14px">(landscape mode)</span></div></div>
<script src="../../assets/lib/phaser-3.90.0.min.js"></script>
<script src="../questions.js"></script>
<script src="realm.js"></script>
</body></html>
